[project]
name = "ha-levelgas"
version = "1.0.1"
description = "Native Home Assistant integration for Levelgas tank monitors"
requires-python = ">=3.14.2"
license = "MIT"

[dependency-groups]
dev = [
  "homeassistant==2026.10.4",
  "pytest-homeassistant-custom-component==0.13.375",
  "ruff>=0.14",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
