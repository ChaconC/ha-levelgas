name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install locked dependencies
        run: uv sync --locked --python 3.14
      - name: Lint Python
        run: uv run --frozen ruff check custom_components tests scripts
      - name: Check Python formatting
        run: uv run --frozen ruff format --check custom_components tests scripts

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install locked dependencies
        run: uv sync --locked --python 3.14
      - name: Run tests
        run: uv run --frozen pytest -q
      - name: Validate integration metadata
        run: uv run --frozen python scripts/validate.py
      - name: Build installation archive
        run: uv run --frozen python scripts/package.py
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          comment: false

  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
